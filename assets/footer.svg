<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Thanks for visiting">
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1E2335" stroke-width="0.6" opacity="0.55"/>
  </pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="0.6" stop-color="#A78BFA"/><stop offset="1" stop-color="#F5B942"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/><stop offset="0.5" stop-color="#A78BFA" stop-opacity="1"/><stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1199" height="119" rx="18" fill="#0A0C14" stroke="#1E2335"/>
<rect x="0" y="0" width="1200" height="120" rx="18" fill="url(#grid)"/>
<rect x="-300" y="0" width="300" height="2" fill="url(#beam)"><animate attributeName="x" from="-300" to="1200" dur="5s" repeatCount="indefinite"/></rect>
<text x="600" y="58" font-family="'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6E8F2" text-anchor="middle">Thanks for stopping by.</text>
<text x="600" y="86" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#9AA3BF" text-anchor="middle">// every system starts as a spell written in code</text>
</svg>