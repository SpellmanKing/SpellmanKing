name: Profile activity

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate activity stats
        run: node .github/scripts/stats.mjs "${{ github.repository_owner }}" dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8B5CF6&color_dots=#ebedf0,#e9d5ff,#c4b5fd,#a78bfa,#7c3aed
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5B942&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
